/* แอปภาคสนาม: แถบบนคงที่ + เนื้อหาเป็นการ์ดเรียงลงล่าง ใช้นิ้วกดได้สะดวก · รายงาน PDF เป็นหน้า A4 สีคงที่ */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface2: #eef2f7; --fg: #17202c; --muted: #5b6878; --line: #d5dce6;
  --accent: #1d5fa6; --accent-ink: #ffffff; --accent-soft: #dcebfb;
  --ok: #1f7a4a; --ok-soft: #dff2e7; --bad: #b4441b; --bad-soft: #fbe5d6; --warn: #8a6100; --warn-soft: #fff1cc;
  --font: "Sarabun", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161d; --surface: #1a212b; --surface2: #222b37; --fg: #e8edf3; --muted: #9aa7b6; --line: #33404f;
  --accent: #6aa8ec; --accent-ink: #0d1520; --accent-soft: #1d3149;
  --ok: #6fd39b; --ok-soft: #173326; --bad: #f19a72; --bad-soft: #3a2117; --warn: #f0c75e; --warn-soft: #362c12; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #1a212b; --surface2: #222b37; --fg: #e8edf3; --muted: #9aa7b6; --line: #33404f;
  --accent: #6aa8ec; --accent-ink: #0d1520; --accent-soft: #1d3149;
  --ok: #6fd39b; --ok-soft: #173326; --bad: #f19a72; --bad-soft: #3a2117; --warn: #f0c75e; --warn-soft: #362c12; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 980px; margin: 0 auto }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 16px; padding: 10px max(16px, env(safe-area-inset-left, 0px)) }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.top-in img { height: 34px; width: auto }
.brand { display: flex; flex-direction: column; line-height: 1.2; min-width: 0 }
.brand b { font-size: 16px } .brand span { font-size: 12.5px; color: var(--muted) }
.top-in .sp { flex: 1 }
.save { font-size: 13px; color: var(--muted); white-space: nowrap }
.save.busy { color: var(--warn) } .save.err { color: var(--bad) }
select, input, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 42px }
textarea { min-height: 72px; resize: vertical }
select, input, textarea { box-sizing: border-box; max-width: 100% }
/* iPad Safari: ช่องวันที่/เวลามีความกว้างขั้นต่ำของตัวเอง ทำให้ล้นทับช่องข้าง → บังคับให้หดตามกรอบ */
input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; width: 100%; text-align: left; line-height: 1.4 }
input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value { text-align: left; min-height: 1.4em }
.grid2 > *, .signs > *, .sign > * { min-width: 0 }
input[type=checkbox] { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent) }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
input.bad { border-color: var(--bad); background: var(--bad-soft) }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; min-height: 42px }
button.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600 }
button.ghost { background: transparent }
button.sm { min-height: 34px; padding: 4px 10px; font-size: 14px }
button:disabled { opacity: .5; cursor: default }
h1 { font-size: 22px; margin: 4px 0 2px; text-wrap: balance } h2 { font-size: 18px; margin: 0 } h3 { font-size: 16px; margin: 0 }
.muted { color: var(--muted) } .small { font-size: 13.5px }
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px }
.stack { display: flex; flex-direction: column; gap: 12px }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) }
.grid2 { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) }
.tile { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 12px; min-height: 92px }
.tile b { font-size: 15.5px } .tile .meta { font-size: 13px; color: var(--muted) }
.bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden } .bar i { display: block; height: 100%; background: var(--accent) }
.chip { display: inline-block; font-size: 12.5px; padding: 1px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); white-space: nowrap }
.chip.ok { background: var(--ok-soft); color: var(--ok) } .chip.bad { background: var(--bad-soft); color: var(--bad) } .chip.warn { background: var(--warn-soft); color: var(--warn) }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0 }
label.f > span { color: var(--muted) }
.item { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px }
.item:first-of-type { border-top: 0; padding-top: 0 }
.item .lab { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap }
.item .lab { align-items: center; justify-content: flex-start; gap: 6px 12px } .item .lab b { font-weight: 600; font-size: 16.5px }
.crit.unit { color: var(--muted); background: var(--surface2) }
.crit { flex: none; font-size: 15.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums }
.crit small { font-weight: 400; color: var(--muted); margin-right: 4px }
.spec { font-size: 13px; color: var(--muted) }
.units { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) }
.unit { display: flex; flex-direction: column; gap: 3px; min-width: 0 } .unit small { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px }
.tri button { padding: 4px; min-height: 40px; font-size: 17px }
.tri button[aria-pressed="true"].v-ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700 }
.tri button[aria-pressed="true"].v-ng { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 700 }
.tri button[aria-pressed="true"].v-na { background: var(--surface2); border-color: var(--muted); font-weight: 700 }
.calc { padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; min-height: 42px; font-variant-numeric: tabular-nums }
.calc.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-soft) }
.photos { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) }
.ph { display: flex; flex-direction: column; gap: 4px } .ph img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: var(--surface2) }
.ph input { min-height: 36px; font-size: 14px; padding: 4px 8px }
.signs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }

<script>
// แอปบันทึกงานหน้างาน (เวอร์ชันแยกสำหรับ iPad) — แทนบริการของ claude.ai ด้วยที่เก็บในเครื่อง (IndexedDB)
// db      : collection(col).onSnapshot / doc(id).set / delete   → ตาราง docs  (key = col/id)
// assets  : upload(blob) → {id}                                  → ตาราง blobs (รูป ลายเซ็น)
// downloads.save({filename, data})                               → แชร์ (LINE / ไฟล์) หรือดาวน์โหลด
// ส่งข้อมูล: exportMonth(month) → ไฟล์ .json (ข้อมูลเดือนนั้น + รูป)   รวมข้อมูล: importFiles() ใช้ที่ออฟฟิศ
(() => {
  const DBN = 'ja_field_v1';
  let idb = null;
  const urls = {};                                   // id → object URL (แสดงรูปทันที)
  const listeners = {};                              // col → [callback]
  const mem = {};                                    // col → {id: data}

  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('docs'); r.result.createObjectStore('blobs') };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = idb.transaction(store, mode), s = t.objectStore(store); let out;
    Promise.resolve(fn(s)).then(v => { out = v });
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  const all = (store) => new Promise((res, rej) => {
    const out = []; const c = idb.transaction(store).objectStore(store).openCursor();
    c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue() } else res(out) };
    c.onerror = () => rej(c.error);
  });
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  const ready = (async () => {
    idb = await open();
    try { navigator.storage && navigator.storage.persist && await navigator.storage.persist() } catch {}
    for (const [k, v] of await all('docs')) { const i = k.indexOf('/'); const col = k.slice(0, i); (mem[col] = mem[col] || {})[k.slice(i + 1)] = v }
    for (const [k, v] of await all('blobs')) urls[k] = URL.createObjectURL(v);
  })();

  const snap = col => ({ docs: Object.entries(mem[col] || {}).map(([id, v]) => ({ id, exists: true, data: () => JSON.parse(JSON.stringify(v)) })), metadata: { fromCache: false } });
  const notify = col => (listeners[col] || []).forEach(cb => setTimeout(() => cb(snap(col)), 0));
  const putDoc = async (col, id, body) => {
    const v = JSON.parse(JSON.stringify(body));
    await tx('docs', 'readwrite', s => s.put(v, col + '/' + id));
    (mem[col] = mem[col] || {})[id] = v; notify(col);
  };
  const putBlob = async (id, blob) => { await tx('blobs', 'readwrite', s => s.put(blob, id)); urls[id] = URL.createObjectURL(blob) };

  const db = {
    collection: col => ({
      onSnapshot(cb) { (listeners[col] = listeners[col] || []).push(cb); setTimeout(() => cb(snap(col)), 0); return () => {} },
      doc(id) {
        id = id || rid();
        return { id, set: body => putDoc(col, id, body),
                 delete: async () => { await tx('docs', 'readwrite', s => s.delete(col + '/' + id)); if (mem[col]) delete mem[col][id]; notify(col) } };
      }
    })
  };
  let dev = null; try { dev = localStorage.getItem('ja.device') } catch {}
  if (!dev) { dev = 'ipad-' + rid().slice(-6); try { localStorage.setItem('ja.device', dev) } catch {} }
  const user = { id: async () => dev, can: async () => true, isOwner: () => true, canEdit: () => true };
  const assets = { upload: async (blob) => { const id = rid(); await putBlob(id, blob); return { id, url: urls[id] } } };

  async function deliver(filename, blob) {          // iPad: แผ่นแชร์ (LINE / บันทึกลงไฟล์) · คอมพิวเตอร์: ดาวน์โหลด
    const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return } catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' } }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  const downloads = { save: async ({ filename, data }) => deliver(filename, data) };

  const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob) });
  const blobIds = (o, out = new Set()) => {
    if (Array.isArray(o)) o.forEach(x => blobIds(x, out));
    else if (o && typeof o === 'object') for (const [k, v] of Object.entries(o)) { if (k === 'id' && typeof v === 'string' && urls[v]) out.add(v); else blobIds(v, out) }
    return out;
  };
  const say = t => { const el = document.getElementById('toast'); if (!el) return; el.textContent = t; el.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => el.hidden = true, 3500) };

  async function buildExport(month) {
    await ready;
    const rd = (typeof C !== 'undefined') ? C.rounds.find(r => r.month === month) : null;
    const pick = [];
    for (const [id, v] of Object.entries(mem.pm || {})) if (id.startsWith(month + '_')) pick.push(['pm', id, v]);
    for (const col of ['summary', 'notices']) if (mem[col] && mem[col][month]) pick.push([col, month, mem[col][month]]);
    if (rd && mem.filters && mem.filters[rd.key]) pick.push(['filters', rd.key, mem.filters[rd.key]]);
    for (const [id, v] of Object.entries(mem.repairs || {})) if (!v.received || String(v.received).startsWith(month)) pick.push(['repairs', id, v]);
    if (!pick.length) return null;
    const blobs = {};
    for (const id of blobIds(pick.map(x => x[2]))) { const b = await tx('blobs', 'readonly', s => new Promise(r => { const q = s.get(id); q.onsuccess = () => r(q.result) })); if (b) blobs[id] = await toB64(b) }

  }
  async function exportMonth(month) {
    say('กำลังเตรียมไฟล์…');
    const out = await buildExport(month);
    if (!out) { say('เดือนนี้ยังไม่มีข้อมูลให้ส่ง'); return }
    const pickN = out.docs.length, blobs = out.blobs;
    const no = (typeof C !== 'undefined' && (C.months.find(m => m.key === month) || {}).no) || '';
    const n = new Date(), z = x => String(x).padStart(2, '0');                   // เวลาไทยของเครื่อง
    const stamp = `${n.getFullYear()}${z(n.getMonth() + 1)}${z(n.getDate())}_${z(n.getHours())}${z(n.getMinutes())}`;
    try { await deliver(`ข้อมูลตรวจเช็ค_งวด${no}_${dev}_${stamp}.json`, new Blob([JSON.stringify(out)], { type: 'application/json' })); try { localStorage.setItem('ja.sent.' + month, String(Date.now())) } catch {}
      if (typeof route === 'function') route();          // หน้าหลักอัปเดต "ยังไม่ได้ส่ง"
      say(`ส่งข้อมูลแล้ว ${pickN} รายการ รูป ${Object.keys(blobs).length} รูป`) }
    catch { say('ยกเลิกการส่งข้อมูล') }
  }

  async function importList(files) {
      await ready; let nd = 0, nb = 0, skip = 0, bad = 0;
      for (const f of files) {
        let j; try { j = JSON.parse(await f.text()) } catch { bad++; continue }
        if (!j || j.app !== 'ja-field') { bad++; continue }
        for (const [id, durl] of Object.entries(j.blobs || {})) if (!urls[id]) { await putBlob(id, await (await fetch(durl)).blob()); nb++ }
        for (const { col, id, data } of j.docs || []) {
          const cur = (mem[col] || {})[id];
          if (!cur || (data.updatedAt || 0) > (cur.updatedAt || 0)) { await putDoc(col, id, data); nd++ } else skip++;
        }
      }
      say(`นำเข้าแล้ว ${nd} รายการ รูป ${nb} รูป` + (skip ? ` (ข้าม ${skip} รายการที่ใหม่กว่าอยู่แล้ว)` : '') + (bad ? ` ไฟล์ใช้ไม่ได้ ${bad}` : ''));
      return { nd, nb, skip, bad };
  }

    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json'; inp.multiple = true;

const COLS = ['pm', 'filters', 'repairs', 'summary', 'notices'];
const store = Object.fromEntries(COLS.map(c => [c, {}]));
let db = null, assets = null, user = null, downloads = null, meId = null, canWrite = true, loaded = false;
let month = ls.get('ja.month', C.months[0].key);
if (!C.months.some(m => m.key === month)) month = C.months[0].key;

const monthObj = () => C.months.find(m => m.key === month);

// ---------- บันทึกอัตโนมัติ ----------
function setSave(t, cls = '') { const el = $('#saveState'); el.textContent = t; el.className = 'save ' + cls }
function markDirty() { if (!curRef) return; dirty = true; setSave('กำลังบันทึก…', 'busy'); clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 1200) }
async function doSave() {
  if (!curRef || !dirty || !db) return;
  if (saving) { saveTimer = setTimeout(doSave, 600); return }
  saving = true; dirty = false;
  const [col, id] = curRef;
  const body = clone(cur); body.updatedAt = Date.now(); body.updatedBy = meId;
  try { await db.collection(col).doc(id).set(body); if (curRef && curRef[1] === id) cur.updatedAt = body.updatedAt; setSave('บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })) }
  catch (e) {
    dirty = true;
    if (e && e.code === 'invalid_argument') { canWrite = false; setSave('บัญชีนี้ดูได้อย่างเดียว', 'err'); showBanner() }
    else if (e && e.code === 'quota_exceeded') setSave('พื้นที่เก็บข้อมูลเต็ม', 'err');
    else { setSave('บันทึกไม่สำเร็จ จะลองใหม่', 'err'); saveTimer = setTimeout(doSave, 4000) }
  } finally { saving = false }
}
function flush() { if (dirty) { clearTimeout(saveTimer); doSave() } }
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush() });

// ---------- เชื่อมฐานข้อมูล ----------
function showBanner() {
  const b = $('#banner');
  if (!db) b.innerHTML = `<div class="banner err">ยังเชื่อมฐานข้อมูลไม่ได้ เปิดหน้านี้ใน claude.ai และลงชื่อเข้าใช้ก่อนบันทึกงาน</div>`;
  else if (!canWrite) b.innerHTML = `<div class="banner">บัญชีนี้ดูข้อมูลได้อย่างเดียว ให้เจ้าของแอปแชร์สิทธิ์ระดับ Contributor ขึ้นไปเพื่อบันทึกงาน</div>`;
  else if (!loaded) b.innerHTML = `<div class="banner">กำลังโหลดข้อมูล…</div>`;
  else b.innerHTML = '';
}
(async () => {
  showBanner();
  try { db = await claude.use('db') } catch { db = null }
  try { user = await claude.use('user') } catch { user = null }
  try { assets = await claude.use('assets') } catch { assets = null }
  try { downloads = await claude.use('downloads') } catch { downloads = null }
  if (user) { meId = await user.id(); const w = await user.can('data.write'); if (w === false) canWrite = false }
  if (!db) { showBanner(); route(); return }
  const slow = setTimeout(() => { if (!loaded) $('#banner').innerHTML = `<div class="banner">ยังโหลดข้อมูลไม่ได้ ตรวจสัญญาณอินเทอร์เน็ต ข้อมูลที่เห็นอาจยังไม่ล่าสุด</div>` }, 10000);
  let pending = new Set(COLS);
  for (const col of COLS) {
    db.collection(col).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data() }); store[col] = m;
      if (!snap.metadata.fromCache) pending.delete(col);
      if (!pending.size && !loaded) { loaded = true; clearTimeout(slow) }
      showBanner(); onRemote(col);
    }, e => { pending.delete(col); $('#banner').innerHTML = `<div class="banner err">โหลดข้อมูลไม่สำเร็จ (${esc(e.code)}) ลองเปิดหน้านี้ใหม่</div>` });
  }
  route();
})();
function onRemote(col) {
  if (curRef && curRef[0] === col) {
    const remote = store[col][curRef[1]];
    const busy = dirty || saving || $('#view').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (remote && !busy && (remote.updatedAt || 0) > (cur.updatedAt || 0)) { cur = clone(remote); render() }
    return;
  }
  if (!curRef) render();
}

// ---------- เส้นทาง ----------
window.addEventListener('hashchange', () => { flush(); route() });
function route() {
  const h = location.hash.slice(1) || 'home';
  curRef = null; cur = null; dirty = false;
  const [kind, ...rest] = h.split('-'); const key = rest.join('-');
  if (kind === 'pm' && C.pm.find(a => a.key === key)) openDoc('pm', `${month}_${key}`, () => {   // ใบใหม่: หัวใบ (วันที่ Work permit ผู้ปฏิบัติงาน เครื่องมือ) ใช้ค่าจากใบอื่นของเดือนนี้
    const prev = C.pm.map(a => store.pm[`${month}_${a.key}`]).filter(d => d && (d.workers || d.permit)).sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0))[0] || {};
    return { month, area: key, v: {}, note: {}, photos: [], signs: {}, date: prev.date || new Date().toLocaleDateString('sv-SE'), permit: prev.permit || '', workers: prev.workers || '', instr: prev.instr || '', cal: prev.cal || '' } });
  else if (kind === 'fl' && C.rounds.find(r => r.key === key)) openDoc('filters', key, () => ({ round: key, rows: {}, photos: [], signs: {} }));
  else if (kind === 'rp' && key) openDoc('repairs', key, () => ({ received: new Date().toISOString().slice(0, 10), photos: [], signs: {} }));
  else if (kind === 'sum') openDoc('summary', month, () => ({ month, signs: {} }));   // งาน/เอกสารแนบ/ปัญหา ดึงอัตโนมัติ (sumAuto)
  else if (kind === 'nt') openDoc('notices', month, () => ({ month, rows: [{}, {}, {}, {}], signs: {} }));
  render();
  window.scrollTo(0, 0);
}
function openDoc(col, id, mk) { curRef = [col, id]; cur = Object.assign(mk(), clone(store[col][id])) }
const V = { home: renderHome };
function render() {
  const h = location.hash.slice(1) || 'home', kind = h.split('-')[0];
  const fn = { flref: renderFilterRef, pm: renderPM, fl: renderFilter, rp: renderRepair, sum: renderSummary, nt: renderNotice, repairs: renderRepairs, reports: renderReports }[kind] || renderHome;
  if (curRef && !cur) { location.hash = 'home'; return }

function pmSummary(a, d) {

  const rng = xs => xs.length ? (Math.min(...xs) === Math.max(...xs) ? `${Math.min(...xs)}` : `${Math.min(...xs)}–${Math.max(...xs)}`) : '';
  const t = val('temp'), h = val('rh'), p = val('pa'); const ach = d ? a.units.map((u, i) => { const q = num(d.v?.[`${a.sections[0].items.find(x => x.tag === 'cfm').id}_${i}`]), v = num(d.v?.[`${a.sections[0].items.find(x => x.tag === 'vol').id}_${i}`]); return q && v ? Math.round(q * 1.699 / v * 10) / 10 : null }).filter(x => x !== null) : [];

function updateCalc() {
  if (!cur) return;
  document.querySelectorAll('[data-calc]').forEach(el => {
    const k = el.dataset.calc;
    if (k === 'ach') { const a = C.pm.find(x => x.key === location.hash.split('-')[1]); const v = achOf(a, +el.dataset.i);
      el.textContent = v === null ? 'ใส่ CFM และปริมาตรห้อง' : `${v} ACH`; el.classList.toggle('bad', v !== null && v <= a.ach) }
    if (k === 'warranty') el.textContent = cur.dateAccept ? thDate(addMonths(cur.dateAccept, 6)) : 'ใส่วันตรวจรับ';
    if (k === 'due') el.textContent = cur.received ? thDate(addDays(cur.received, 3)) : '—';
  });

// ความคืบหน้าใบ PM ที่เปิดอยู่: แถบล่าง + ตัวนับรายหมวด
function updateProgress() {
  const a = curRef && curRef[0] === 'pm' && C.pm.find(x => x.key === cur.area); if (!a) return;
  const p = pmProgress(a, cur), [t] = status(cur, p, 3);
  const sel = selOf(a), multi = a.units.length > 1;
  const [udn, und] = unitCount(a, cur, sel);
  if ($('#progTxt')) { $('#progTxt').textContent = multi ? `${a.units[sel]} ${udn}/${und}   ทั้งพื้นที่ ${p}%` : `${a.name.split(' (')[0]}  ${t}`; $('#progBar').style.width = p + '%' }
  a.units.forEach((u, i) => { const el = document.querySelector(`[data-uprog="${i}"]`); if (!el) return; const [dn, nd] = unitCount(a, cur, i); el.textContent = `${dn}/${nd}`; el.className = 'chip ' + (dn === nd && nd ? 'ok' : dn ? 'warn' : '') });
  a.sections.forEach((s, si) => { const el = document.querySelector(`[data-secprog="${si}"]`); if (!el) return;
    let need = 0, done = 0; s.items.forEach(it => { if (it.kind === 'ach') return; a.units.forEach((u, i) => { if (multi && i !== sel || na(a, it, i)) return; need++; const v = cur.v[`${it.id}_${i}`]; if (v !== undefined && v !== '') done++ }) });
    el.textContent = `${done}/${need}`; el.className = 'chip ' + (done === need ? 'ok' : done ? 'warn' : '') });
}

function paginate(blocks, land = false, code = '') {
  blocks = blocks.reduce((acc, bl) => { const prev = acc.at(-1);   // หัวข้อ (h2) ติดกับตารางถัดไป ไม่ค้างท้ายหน้า
